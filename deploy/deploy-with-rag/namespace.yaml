apiVersion: v1
kind: Namespace
metadata:
  name: orange-code
  labels:
    name: orange-code
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orange-code-network-policy
  namespace: orange-code
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: orange-code
    ports:
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 8501
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: orange-code
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53