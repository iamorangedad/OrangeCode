apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-no-rag
  namespace: orange-code
  labels:
    app: agent-no-rag
    component: agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-no-rag
  template:
    metadata:
      labels:
        app: agent-no-rag
        component: agent
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu
      initContainers:
      - name: setup-agent
        image: python:3.11-slim
        volumeMounts:
        - name: agent-scripts
          mountPath: /app
        - name: source-code
          mountPath: /app/source
        command: ["sh", "-c"]
        args:
        - |
          # Install dependencies
          pip3 install --no-cache-dir --upgrade pip &&
          pip3 install --no-cache-dir ollama==0.6.1 rich==14.2.0 requests==2.32.5 &&
          
          # Copy agent files from source
          cp /app/source/agent_no_rag.py /app/ &&
          cp /app/source/utils.py /app/ &&
          echo "✅ Agent setup completed successfully"
      containers:
      - name: agent-no-rag
        image: python:3.11-slim
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: OLLAMA_HOST
          value: "http://10.0.0.55:11434"
        volumeMounts:
        - name: agent-scripts
          mountPath: /app
        command: ["python3", "/app/agent_no_rag.py"]
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: agent-scripts
        emptyDir: {}
      - name: source-code
        hostPath:
          path: /Users/mac/Documents/Agent/OrangeCode  # Adjust this path for your environment
          type: Directory
      restartPolicy: Always