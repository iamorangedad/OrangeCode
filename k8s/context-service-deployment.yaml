apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-service
  namespace: orange-code
  labels:
    app: context-service
    component: rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: context-service
  template:
    metadata:
      labels:
        app: context-service
        component: rag
    spec:
      nodeSelector:
        kubernetes.io/hostname: ubuntu
      containers:
      - name: context-service
        image: dustynv/pytorch:2.7-r36.4.0-cu128-24.04
        ports:
        - containerPort: 8000
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: chroma-db-storage
          mountPath: /app/chroma_db
        - name: context-logs-storage
          mountPath: /app/logs
        workingDir: /app
        command: ["sh", "-c"]
        args:
        - |
          apt-get update && apt-get install -y --no-install-recommends python3-pip build-essential && rm -rf /var/lib/apt/lists/* &&
          pip3 install --no-cache-dir --upgrade pip setuptools wheel &&
          pip3 install --no-cache-dir fastapi==0.104.1 uvicorn==0.24.0 pydantic==2.5.0 chromadb==0.4.10 sentence-transformers==2.2.2 &&
          python3 -m uvicorn context_service:app --host 0.0.0.0 --port 8000
        readinessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
      volumes:
      - name: chroma-db-storage
        persistentVolumeClaim:
          claimName: chroma-db-pvc
      - name: context-logs-storage
        persistentVolumeClaim:
          claimName: context-logs-pvc
      restartPolicy: Always