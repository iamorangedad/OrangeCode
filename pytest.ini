[pytest]
# Pytest configuration for Orange Code project

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    asyncio: Mark test as async

# Timeout configuration
timeout = 60

# Coverage
# addopts = --cov=. --cov-report=html --cov-report=term